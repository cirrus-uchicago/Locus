[project]
name = "locus"
version = "0.1.0"
description = "Fuzzing predicate insertion agent"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "pydantic-ai",
    "typer",
]

[project.scripts]
locus = "locus.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/locus"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "klee: tests requiring KLEE to be installed (skip with -m 'not klee')",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio>=1.3.0",
]
